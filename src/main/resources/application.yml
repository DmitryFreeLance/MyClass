spring:
  datasource:
    url: jdbc:sqlite:${BOT_DB_PATH:/data/bot.db}?busy_timeout=5000&journal_mode=WAL&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

bot:
  max:
    base-url: ${MAX_API_BASE_URL:https://platform-api2.max.ru}
    token: ${MAX_BOT_TOKEN:}
    webhook-enabled: ${MAX_WEBHOOK_ENABLED:false}
    long-poll-timeout-sec: ${MAX_LONG_POLL_TIMEOUT_SEC:25}
    long-poll-limit: ${MAX_LONG_POLL_LIMIT:100}
  site:
    registration-url: ${SITE_REGISTRATION_URL:https://roboacademiya.ru/}
    contact-url: ${SITE_CONTACT_URL:https://max.ru/u/f9LHodD0cOJNUKEvX8lom5RFjS6uzWWEaBNgRYyNvHAa_WiiftEqSwd7b3I}
  moyklass:
    enabled: ${MOYKLASS_ENABLED:false}
    base-url: ${MOYKLASS_BASE_URL:}
    token: ${MOYKLASS_TOKEN:}
    timeout-sec: ${MOYKLASS_TIMEOUT_SEC:15}
    lead-state-id: ${MOYKLASS_LEAD_STATE_ID:}
    join-status-id: ${MOYKLASS_JOIN_STATUS_ID:2}
    allowed-client-state-ids: ${MOYKLASS_ALLOWED_CLIENT_STATE_IDS:}
    max-id-attribute-alias: ${MOYKLASS_MAX_ID_ATTR_ALIAS:}
    parent-name-attribute-alias: ${MOYKLASS_PARENT_NAME_ATTR_ALIAS:}
    pay-link-base: ${MOYKLASS_PAY_LINK_BASE:https://pay.tvoyklass.com/key/}

server:
  port: ${PORT:8080}
